# Generated from src/lib/content-model.mjs by npm run cms:sync.
# Set backend.base_url when the institution-owned auth Worker exists.
# Sveltia uses its native local-repository picker, not Decap local_backend.
backend:
  name: github
  repo: FabLab-Saga/website
  branch: main
  base_url: https://auth-not-configured.invalid
publish_mode: editorial_workflow
media_folder: src/assets/uploads
public_folder: /src/assets/uploads
media_libraries:
  default:
    config:
      max_file_size: 2000000
      transformations:
        raster_image:
          format: webp
          width: 2048
          height: 2048
          quality: 85
collections:
  - name: site
    label: Vefurinn
    files:
      - name: is
        label: Íslenska
        file: src/content/site/is.yaml
